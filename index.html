<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="only light" />
    <style>
      html {
        color-scheme: only light;
        background-color: #f8f4e9;
      }

      html,
      body,
      #app {
        min-height: 100%;
        margin: 0;
        background: #f8f4e9;
      }

      .app-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #20584f;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        background:
          radial-gradient(circle at 18% 16%, rgba(244, 201, 76, .34), transparent 28%),
          radial-gradient(circle at 82% 74%, rgba(32, 88, 79, .16), transparent 34%),
          #f8f4e9;
      }

      .app-boot__card {
        width: min(72vw, 320px);
        display: grid;
        gap: 14px;
        justify-items: center;
      }

      .app-boot__mark {
        width: 72px;
        height: 72px;
        display: grid;
        place-items: center;
        border-radius: 22px;
        color: #fffdf7;
        background: #20584f;
        box-shadow: 0 18px 40px rgba(32, 88, 79, .18);
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 1px;
      }

      .app-boot__line {
        width: 100%;
        height: 9px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(32, 88, 79, .12);
      }

      .app-boot__line::after {
        content: "";
        display: block;
        width: 46%;
        height: 100%;
        border-radius: inherit;
        background: #f4c94c;
        animation: boot-line 1.1s ease-in-out infinite alternate;
      }

      @keyframes boot-line {
        from { transform: translateX(0); }
        to { transform: translateX(120%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot__line::after { animation: none; width: 64%; }
      }
    </style>
    <script>
      var coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('top: env(a)') ||
        CSS.supports('top: constant(a)'))
      document.write(
        '<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' +
        (coverSupport ? ', viewport-fit=cover' : '') + '" />')
    </script>
    <title></title>
    <!--preload-links-->
    <!--app-context-->
  </head>
  <body>
    <div id="app">
      <div class="app-boot" aria-label="TAGO 正在启动">
        <div class="app-boot__card">
          <div class="app-boot__mark">TAGO</div>
          <div class="app-boot__line"></div>
        </div>
      </div>
      <!--app-html-->
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
